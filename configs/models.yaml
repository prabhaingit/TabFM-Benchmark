models:

  tabpfn:
    class: src.models.tabpfn_model.TabPFNWrapper
    fixed_params:
      device: "cpu"         # change to "cuda" if available
      N_ensemble_configurations: 8  # TabPFN v2 default
    tunable: false          # key point: TabPFN is zero-shot, no tuning

  tabfm_jax:
    class: src.models.tabfm_model.TabFMJAXWrapper
    description: "Google's TabFM - zero-shot tabular foundation model (JAX backend)"
    requires_python: ">=3.11"
    tunable: false          # TabFM is zero-shot, no tuning

  tabfm_pytorch:
    class: src.models.tabfm_model.TabFMPyTorchWrapper
    description: "Google's TabFM - zero-shot tabular foundation model (PyTorch backend)"
    requires_python: ">=3.11"
    tunable: false          # TabFM is zero-shot, no tuning

  sap_rpt:
    class: src.models.sap_rpt_model.SAPRptWrapper
    description: "SAP RPT-1 OSS — zero-shot semantics-aware tabular in-context learner"
    tunable: false
    fixed_params:
      max_context_size: 8192   # reduce to 2048 for lighter GPU memory usage
      bagging: 1               # bagging>1 has negligible AUC effect on encoded data

  xgboost:
    class: src.models.xgboost_model.XGBoostWrapper
    tunable: true
    n_trials: 15            # reduced from 50 for speed
    search_space:
      n_estimators: [100, 500]
      max_depth: [3, 8]
      learning_rate: [0.05, 0.2]
      subsample: [0.7, 1.0]
      colsample_bytree: [0.7, 1.0]
      min_child_weight: [1, 5]
      reg_alpha: [0.0, 0.5]
      reg_lambda: [0.5, 1.5]

  lightgbm:
    class: src.models.lightgbm_model.LightGBMWrapper
    tunable: true
    n_trials: 15            # reduced from 50 for speed
    search_space:
      n_estimators: [100, 500]
      max_depth: [3, 8]
      learning_rate: [0.05, 0.2]
      num_leaves: [15, 63]
      subsample: [0.7, 1.0]
      colsample_bytree: [0.7, 1.0]
      min_child_samples: [10, 30]

  catboost:
    class: src.models.catboost_model.CatBoostWrapper
    tunable: true
    n_trials: 15            # reduced from 50 for speed
    search_space:
      iterations: [100, 500]
      depth: [4, 8]
      learning_rate: [0.05, 0.2]
      l2_leaf_reg: [1, 5]
      border_count: [64, 128]

  mlp_sklearn:
    class: src.models.mlp_model.MLPWrapper
    tunable: true
    n_trials: 10            # reduced from 30 for speed
    search_space:
      hidden_layer_sizes: [[64], [128], [64,64]]
      alpha: [1e-4, 1e-2]
      learning_rate_init: [1e-4, 1e-3]
      max_iter: [200, 300]